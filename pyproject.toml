[project]
name = "early-mcp"
version = "1.0.0"
description = "Complete MCP server for Early (Timeular) time tracking API"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Lukas Weichselbaum", email = "lukas@lukasweichselbaum.com"}
]
keywords = ["mcp", "early", "timeular", "time-tracking", "claude", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    # mcp 2.x removed FastMCP. 1.30.0 is the newest 1.x and clears the SDK advisories.
    "mcp>=1.30.0,<2",
    "pydantic>=2.0.0",
    # Transitive security floors (critical/high, plus python-multipart CVE-2026-53540).
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "cryptography>=50.0.0",
    "h11>=0.16.0",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
]

[project.urls]
Homepage = "https://github.com/weichselbaum/early-mcp"
Repository = "https://github.com/weichselbaum/early-mcp"
Issues = "https://github.com/weichselbaum/early-mcp/issues"

[project.scripts]
early-mcp = "early_mcp:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
